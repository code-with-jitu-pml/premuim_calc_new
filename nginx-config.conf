# Nginx Configuration for Premium Calculator UAT
# Place this file at: /etc/nginx/sites-available/premium-calculator
# Then create symlink: sudo ln -s /etc/nginx/sites-available/premium-calculator /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 43.224.137.27;  # Replace with your domain if you have one
    
    # Increase client body size for file uploads if needed
    client_max_body_size 10M;
    
    # Access and error logs
    access_log /var/log/nginx/premium-calculator-access.log;
    error_log /var/log/nginx/premium-calculator-error.log;
    
    # Handle static files explicitly (more specific, should come first)
    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        
        # Don't add cache headers if Spring Boot returns error
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Root location - proxy to Spring Boot application
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Don't buffer responses
        proxy_buffering off;
        
        # Pass through all response headers
        proxy_pass_header Server;
        proxy_pass_header Set-Cookie;
        
        # Don't modify redirects
        proxy_redirect off;
        
        # Handle errors - pass through Spring Boot error responses
        proxy_intercept_errors off;
    }
    
    # Static files - serve directly from nginx (optional optimization)
    # Uncomment if you want nginx to serve static files directly
    # location /static/ {
    #     alias /opt/premium-calculator/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}

