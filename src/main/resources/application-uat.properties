# Server Configuration
server.port=8084
server.address=0.0.0.0
server.servlet.context-path=/

# Application Name
spring.application.name=premium-calculator-uat

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.tms.calc=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/opt/applications/premium-calculator/logs/premium-calculator-uat.log
logging.file.max-size=10MB
logging.file.max-history=30

# Application Properties
app.name=Premium Calculator
app.description=Agricultural Insurance Premium Calculator - UAT
app.version=1.0.0
app.environment=UAT