server:
  port: 8084
  address: 0.0.0.0  # Bind to all network interfaces (allows external access)
  servlet:
    context-path: /

spring:
  application:
    name: premium-calculator-uat

  
  # CORS Configuration for UAT
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

# Logging Configuration for UAT
logging:
  level:
    com.tms.calc: INFO
    org.springframework.web: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/premium-calculator-uat.log
    max-size: 10MB
    max-history: 30

# Application specific properties
app:
  name: "Premium Calculator"
  description: "Agricultural Insurance Premium Calculator - UAT"
  version: "1.0.0"
  environment: "UAT"

