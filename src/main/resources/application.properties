# Server Configuration
server.port=8084
server.servlet.context-path=/

# Application Name
spring.application.name=premium-calculator

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.tms.calc=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/premium-calculator.log

# Application Properties
app.name=Premium Calculator
app.description=Agricultural Insurance Premium Calculator - LOCAL
app.version=1.0.0
app.environment=LOCAL